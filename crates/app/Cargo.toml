[package]
name = "text-researcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "text-researcher"
path = "src/main.rs"

[dependencies]
text-researcher-core = { path = "../core" }
udpipe-client = { path = "../udpipe-client" }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
rayon = "1"
