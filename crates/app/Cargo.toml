[package]
name = "text-researcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "text-researcher"
path = "src/main.rs"

[dependencies]
text-researcher-core = { path = "../core" }
udpipe-ffi = { path = "../udpipe-ffi" }
ratatui = "0.30"
crossterm = "0.28"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
