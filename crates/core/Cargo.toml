[package]
name = "text-researcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
udpipe-client = { path = "../udpipe-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "1"
log = "0.4"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
postgres = "0.19"
r2d2 = "0.8"
r2d2_postgres = "0.18"
rayon = "1"
